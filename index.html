<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KeepClone · Notas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --card-bg: white;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #e5e7eb;
            --header-bg: white;
            --badge-local: #dbeafe;
            --badge-local-text: #1e40af;
            --badge-sheet: #d1fae5;
            --badge-sheet-text: #065f46;
            --info-bar-bg: #fef3c7;
            --info-bar-text: #92400e;
            --canvas-bg: white;
            --canvas-border: #d1d5db;
            --canvas-active-border: #667eea;
            --canvas-active-bg: #f0f4ff;
            --btn-primary: linear-gradient(135deg, #667eea, #764ba2);
            --btn-reset: #6b7280;
            --btn-reset-hover: #4b5563;
            --btn-add: linear-gradient(135deg, #10b981, #059669);
            --toast-bg: #333;
        }

        body.dark-mode {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --card-bg: #1e1e2e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #2d2d3d;
            --header-bg: #252535;
            --badge-local: #1e3a5f;
            --badge-local-text: #93c5fd;
            --badge-sheet: #064e3b;
            --badge-sheet-text: #6ee7b7;
            --info-bar-bg: #451a03;
            --info-bar-text: #fde68a;
            --canvas-bg: #1a1a2a;
            --canvas-border: #3d3d4d;
            --canvas-active-border: #818cf8;
            --canvas-active-bg: #1e1e3a;
            --btn-primary: linear-gradient(135deg, #818cf8, #a78bfa);
            --btn-reset: #4a4a5a;
            --btn-reset-hover: #5a5a6a;
            --btn-add: linear-gradient(135deg, #34d399, #059669);
            --toast-bg: #2d2d3d;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.92), rgba(0,0,0,0.96));
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .auth-card {
            background: var(--card-bg);
            max-width: 650px;
            width: 90%;
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4);
            animation: fadeUp 0.4s ease;
            transition: background 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .canvas-container {
            background: var(--canvas-active-bg);
            border-radius: 1.5rem;
            padding: 1rem;
            margin: 1rem 0;
            border: 2px solid var(--canvas-border);
            transition: all 0.3s;
        }

        .canvas-container.active {
            border-color: var(--canvas-active-border);
            background: var(--canvas-active-bg);
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            background: var(--canvas-bg);
            border-radius: 1rem;
            cursor: crosshair;
            touch-action: none;
        }

        .btn-candado {
            background: var(--btn-primary);
            border: none;
            color: white;
            font-size: 2rem;
            padding: 15px;
            border-radius: 60px;
            cursor: pointer;
            width: 80px;
            height: 80px;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .btn-candado:hover { transform: scale(1.05); }
        .btn-reset {
            background: var(--btn-reset);
            border: none;
            color: white;
            font-size: 1.2rem;
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            width: 50px;
            height: 50px;
            margin-top: 10px;
        }
        .btn-reset:hover { background: var(--btn-reset-hover); }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.5rem;
            display: none;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
            background: var(--header-bg);
            padding: 1rem 2rem;
            border-radius: 1.5rem;
            transition: background 0.3s ease;
        }

        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--btn-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .info-bar {
            background: var(--info-bar-bg);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--info-bar-text);
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .btn-add {
            background: var(--btn-add);
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .note-card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.2rem;
            position: relative;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .note-card:hover { transform: translateY(-3px); }

        .note-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .badge-local { background: var(--badge-local); color: var(--badge-local-text); }
        .badge-sheet { background: var(--badge-sheet); color: var(--badge-sheet-text); }

        .note-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            margin-top: 0.5rem;
            color: var(--text-primary);
            padding-right: 60px;
        }

        .note-content {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            margin-bottom: 1rem;
        }

        .note-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
            padding-top: 0.8rem;
        }
        .note-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 30px;
        }
        .btn-edit { color: #3b82f6; }
        .btn-delete { color: #ef4444; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }
        .modal-content h3 { margin-bottom: 1rem; color: var(--text-primary); }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 1rem;
            font-size: 1rem;
            margin-bottom: 1rem;
            background: var(--card-bg);
            color: var(--text-primary);
        }
        .modal-content textarea { min-height: 120px; resize: vertical; }
        .modal-buttons { display: flex; gap: 1rem; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; }
        .btn-save { background: var(--btn-primary); color: white; }
        .btn-cancel { background: var(--btn-reset); color: white; }

        footer { margin-top: 3rem; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.7); }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 3000;
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 640px) { .auth-card { padding: 1.2rem; } .notes-grid { grid-template-columns: 1fr; } }
        .acceso-denegado { animation: shake 0.3s ease; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
        .button-group { display: flex; gap: 15px; justify-content: center; align-items: center; margin-top: 15px; }
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--text-primary); border-radius: 50%; border-top-color: transparent; animation: spin 0.6s linear infinite; margin-left: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .estado-conexion { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; padding: 4px 10px; border-radius: 30px; }
        .conectado { background: #10b98120; color: #10b981; }
        .offline { background: #ef444420; color: #f87171; }
        .tipo-selector { margin-bottom: 1rem; text-align: left; }
        .tipo-selector label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-primary); margin-top: 0.5rem; }
    </style>
</head>
<body>

<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="drawCanvas" width="550" height="350"></canvas>
        </div>
        <div class="button-group">
            <button id="validarBtn" class="btn-candado"><i class="fas fa-lock"></i></button>
            <button id="clearBtn" class="btn-reset"><i class="fas fa-trash-alt"></i></button>
        </div>
    </div>
</div>

<div id="appMain" class="app-container">
    <div class="app-header">
        <h1><i class="fas fa-sticky-note"></i> KeepClone</h1>
        <div id="connectionStatus" class="estado-conexion conectado"><i class="fas fa-cloud-upload-alt"></i> Sincronizado</div>
    </div>
    <div class="info-bar">
        <span><i class="fas fa-database"></i> <span id="noteCount">0</span> notas</span>
        <button id="openModalBtn" class="btn-add"><i class="fas fa-plus"></i> Nueva nota</button>
    </div>
    <div id="notesContainer" class="notes-grid">Cargando notas...</div>
    <footer>🔐</footer>
</div>

<div id="noteModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle"><i class="fas fa-plus-circle"></i> Nueva nota</h3>
        <div class="tipo-selector">
            <label><input type="radio" name="tipoNota" value="local" checked> 📁 Guardar localmente</label>
            <label><input type="radio" name="tipoNota" value="sheet"> 🌐 Guardar en Google Sheets</label>
        </div>
        <input type="text" id="noteTitle" placeholder="Título">
        <textarea id="noteContent" placeholder="Contenido"></textarea>
        <input type="hidden" id="editingId">
        <input type="hidden" id="editingRow">
        <div class="modal-buttons">
            <button class="btn-cancel" id="cancelModalBtn">Cancelar</button>
            <button class="btn-save" id="saveNoteBtn">Guardar</button>
        </div>
    </div>
</div>

<script>
    // 🔴 REEMPLAZA CON LA URL DE TU APPS SCRIPT DESPLEGADO
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxoJNc_PxdkqWgSGfY8JcNkdIARTQb0oT5S7XRKrwSouHQooXQtRvZDV7vqaWFtrFiUUA/exec";
    
    let notas = [];
    let editingId = null;
    let editingRow = null;
    let authCompleted = false;
    let mostrarGuia = true;
    let conexionActiva = true;

    const NOTA_XML_FIJA = {
        id: "local_fija_001",
        title: "📌 Nota Fija XML",
        content: "Esta es una nota fija almacenada localmente.\n\n✏️ No se puede editar\n🗑️ No se puede eliminar\n💾 Persiste en tu navegador",
        type: "local",
        fromSheet: false,
        fija: true
    };

    function cargarNotasLocales() {
        const guardado = localStorage.getItem('keepclone_notas_locales');
        let locales = guardado ? JSON.parse(guardado) : [];
        const existeFija = locales.some(n => n.id === NOTA_XML_FIJA.id);
        if (!existeFija) locales.unshift({ ...NOTA_XML_FIJA });
        localStorage.setItem('keepclone_notas_locales', JSON.stringify(locales));
        return locales;
    }

    function guardarNotasLocales(locales) {
        localStorage.setItem('keepclone_notas_locales', JSON.stringify(locales));
    }

    function agregarNotaLocal(title, content) {
        const locales = cargarNotasLocales();
        locales.push({ id: "local_" + Date.now(), title: title || "Sin título", content: content || "", type: "local", fromSheet: false });
        guardarNotasLocales(locales);
    }

    function editarNotaLocal(id, newTitle, newContent) {
        const locales = cargarNotasLocales();
        const idx = locales.findIndex(n => n.id === id);
        if (idx !== -1 && !locales[idx].fija) {
            locales[idx].title = newTitle || "Sin título";
            locales[idx].content = newContent || "";
            guardarNotasLocales(locales);
            return true;
        }
        return false;
    }

    function eliminarNotaLocal(id) {
        const locales = cargarNotasLocales();
        const nota = locales.find(n => n.id === id);
        if (nota && !nota.fija) {
            guardarNotasLocales(locales.filter(n => n.id !== id));
            return true;
        }
        return false;
    }

    async function probarConexion() {
        try {
            const controller = new AbortController();
            setTimeout(() => controller.abort(), 5000);
            const res = await fetch(`${APPS_SCRIPT_URL}?action=getAllNotes`, { signal: controller.signal });
            return res.ok;
        } catch { return false; }
    }

    async function cargarNotasSheets() {
        try {
            const res = await fetch(`${APPS_SCRIPT_URL}?action=getAllNotes`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            if (data.success && data.notes) return data.notes;
            return [];
        } catch { return []; }
    }

    async function agregarNotaSheet(title, content) {
        try {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'addNote', title, content })
            });
            return await res.json();
        } catch { return { success: false }; }
    }

    async function editarNotaSheet(row, title, content) {
        try {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'updateNote', row, title, content })
            });
            return await res.json();
        } catch { return { success: false }; }
    }

    async function eliminarNotaSheet(row) {
        try {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'deleteNote', row })
            });
            return await res.json();
        } catch { return { success: false }; }
    }

    async function actualizarUI() {
        const hayConexion = await probarConexion();
        conexionActiva = hayConexion;
        
        const statusDiv = document.getElementById("connectionStatus");
        if (hayConexion) {
            document.body.classList.remove('dark-mode');
            statusDiv.className = "estado-conexion conectado";
            statusDiv.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Sincronizado';
        } else {
            document.body.classList.add('dark-mode');
            statusDiv.className = "estado-conexion offline";
            statusDiv.innerHTML = '<i class="fas fa-plug"></i> Modo local';
        }
        
        const locales = cargarNotasLocales();
        let sheets = [];
        if (hayConexion) sheets = await cargarNotasSheets();
        
        notas = [...sheets, ...locales];
        
        const container = document.getElementById("notesContainer");
        if (notas.length === 0) {
            container.innerHTML = `<div style="background:var(--card-bg); border-radius:1rem; padding:3rem; text-align:center;"><i class="fas fa-sticky-note" style="font-size:3rem; margin-bottom:1rem;"></i><p>No hay notas</p><button class="btn-add" onclick="document.getElementById('openModalBtn').click()">Crear primera nota</button></div>`;
        } else {
            container.innerHTML = notas.map(n => {
                const esLocal = n.type === "local" || n.fromSheet === false;
                const esFija = n.fija === true;
                return `
                    <div class="note-card">
                        <div class="note-badge ${esLocal ? 'badge-local' : 'badge-sheet'}">${esLocal ? '📁 Local' : '🌐 Sheets'}</div>
                        <div class="note-title">${escapeHtml(n.title)}</div>
                        <div class="note-content">${escapeHtml(n.content)}</div>
                        <div class="note-actions">
                            <button class="btn-edit" onclick='editarNotaUI("${n.id}", "${esLocal ? 'local' : 'sheet'}", ${n.row || 'null'}, ${JSON.stringify(n.title)}, ${JSON.stringify(n.content)}, ${esFija})' ${esFija ? 'disabled' : ''}>${esFija ? 'Bloqueada' : '<i class="fas fa-edit"></i> Editar'}</button>
                            <button class="btn-delete" onclick='eliminarNotaUI("${n.id}", "${esLocal ? 'local' : 'sheet'}", ${n.row || 'null'})' ${esFija ? 'disabled style="opacity:0.5;"' : ''}><i class="fas fa-trash-alt"></i> Eliminar</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        document.getElementById("noteCount").innerText = notas.length;
    }

    async function agregarNotaUI(title, content, tipo) {
        if (tipo === "local") {
            agregarNotaLocal(title, content);
            mostrarToast("✅ Nota local guardada");
        } else {
            if (!conexionActiva) { mostrarToast("⚠️ Sin conexión, guardando localmente"); agregarNotaLocal(title, content); }
            else {
                const res = await agregarNotaSheet(title, content);
                if (res.success) mostrarToast("✅ Guardado en Sheets");
                else { mostrarToast("❌ Error, guardando localmente"); agregarNotaLocal(title, content); }
            }
        }
        await actualizarUI();
    }

    async function editarNotaUI(id, tipo, row, oldTitle, oldContent, esFija) {
        if (esFija) { mostrarToast("⚠️ No se puede editar la nota fija"); return; }
        const newTitle = prompt("Editar título:", oldTitle);
        if (newTitle === null) return;
        const newContent = prompt("Editar contenido:", oldContent);
        if (newContent === null) return;
        
        if (tipo === "local") {
            if (editarNotaLocal(id, newTitle, newContent)) mostrarToast("✏️ Nota local editada");
        } else {
            if (!conexionActiva) { mostrarToast("⚠️ Sin conexión a Sheets"); return; }
            const res = await editarNotaSheet(row, newTitle, newContent);
            if (res.success) mostrarToast("✏️ Nota editada en Sheets");
            else mostrarToast("❌ Error al editar");
        }
        await actualizarUI();
    }

    async function eliminarNotaUI(id, tipo, row) {
        if (!confirm("¿Eliminar esta nota?")) return;
        if (tipo === "local") {
            if (eliminarNotaLocal(id)) mostrarToast("🗑️ Nota local eliminada");
        } else {
            if (!conexionActiva) { mostrarToast("⚠️ Sin conexión a Sheets"); return; }
            const res = await eliminarNotaSheet(row);
            if (res.success) mostrarToast("🗑️ Nota eliminada de Sheets");
            else mostrarToast("❌ Error al eliminar");
        }
        await actualizarUI();
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/\n/g, '<br>');
    }

    function mostrarToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.innerHTML = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    // Modal
    const modal = document.getElementById("noteModal");
    document.getElementById("openModalBtn").onclick = () => {
        document.getElementById("modalTitle").innerHTML = '<i class="fas fa-plus-circle"></i> Nueva nota';
        document.getElementById("noteTitle").value = "";
        document.getElementById("noteContent").value = "";
        document.getElementById("editingId").value = "";
        document.getElementById("editingRow").value = "";
        document.querySelector('input[value="local"]').checked = true;
        modal.style.display = "flex";
    };
    document.getElementById("cancelModalBtn").onclick = () => modal.style.display = "none";
    document.getElementById("saveNoteBtn").onclick = async () => {
        const title = document.getElementById("noteTitle").value.trim();
        const content = document.getElementById("noteContent").value.trim();
        const tipo = document.querySelector('input[name="tipoNota"]:checked').value;
        if (!title && !content) { mostrarToast("⚠️ Escribe algo"); return; }
        modal.style.display = "none";
        await agregarNotaUI(title || "Sin título", content, tipo);
    };
    modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

    // Aut
